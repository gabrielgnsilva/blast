      - texlive-mathscience
      - texlive-pictures
      - biber
  - name: docker
    purpose: Provide Docker and related tools
    packages:
      - docker
      - docker-compose
  - name: virtualization
    purpose: Provide GUI-based virtualization management
    packages:
      - qemu-desktop
      - libvirt
      - dnsmasq
      - vde2
      - openbsd-netcat
      - dmidecode
      - iptables
      - edk2-ovmf
