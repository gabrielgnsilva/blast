blast_amd_gpu_package_groups:
  - name: amd_gpu
    purpose: Install AMD GPU packages
    packages:
      - linux-firmware-amdgpu
      - mesa
      - lib32-mesa
      - vulkan-radeon
      - lib32-vulkan-radeon
      - vulkan-icd-loader
      - lib32-vulkan-icd-loader
      - vulkan-tools
      - clinfo
  - name: amd-gpu-compute
    purpose: Install AMD GPU compute runtimes
    packages:
      - rocm-opencl-runtime
      - rocm-hip-runtime
      - hip-runtime-amd
      - rocm-opencl-sdk
      - rocm-hip-sdk
      - rocm-smi-lib
      - ocl-icd
      - rocminfo
