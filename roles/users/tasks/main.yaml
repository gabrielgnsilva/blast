- name: Configure target user
  ansible.builtin.user:
    name: "{{ blast_username }}"
    comment: "{{ blast_user_name }}"
    create_home: true
    groups: "wheel"
    append: true
    shell: "/bin/zsh"
    password: "{{ blast_user_password | default(omit) }}"
    update_password: "{{ blast_user_update_password | default('on_create') }}"
    state: present
- name: Configure package-dependent supplementary groups
  ansible.builtin.import_tasks: package_groups.yaml
- name: Set target user facts
  ansible.builtin.import_tasks: facts.yaml
- name: Check rustup installation
  ansible.builtin.stat:
    path: /usr/bin/rustup
  register: blast_rustup_binary
- name: Check target user's Rust toolchains
  become: true
  become_user: "{{ blast_username }}"
  ansible.builtin.command:
    cmd: rustup toolchain list
  environment:
    HOME: "{{ blast_user_home }}"
  changed_when: false
  failed_when: false
  register: blast_rustup_toolchains
  when: blast_rustup_binary.stat.exists
- name: Install default Rust stable toolchain
  become: true
  become_user: "{{ blast_username }}"
  ansible.builtin.command:
    cmd: rustup default stable
  environment:
    HOME: "{{ blast_user_home }}"
  when:
    - blast_rustup_binary.stat.exists
    - (blast_rustup_toolchains.rc | default(1)) == 0
    - (blast_rustup_toolchains.stdout | default('')) is not regex('(?m)^stable[^ ]* \([^)]*default[^)]*\)$')
- name: Check NVM installation
  ansible.builtin.stat:
    path: /usr/share/nvm/init-nvm.sh
  register: blast_nvm_init
- name: Ensure target user's NVM directory exists
  ansible.builtin.file:
    path: "{{ blast_user_home }}/.local/share/nvm"
    state: directory
    owner: "{{ blast_username }}"
    group: "{{ blast_user_group }}"
    mode: "0755"
  when: blast_nvm_init.stat.exists
- name: Check target user's Node.js LTS installation
  become: true
  become_user: "{{ blast_username }}"
  ansible.builtin.shell:
    cmd: |
      source /usr/share/nvm/init-nvm.sh
      nvm version 'lts/*'
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ blast_user_home }}/.local/share/nvm"
    HOME: "{{ blast_user_home }}"
  changed_when: false
  failed_when: blast_nvm_lts.rc not in [0, 3]
  register: blast_nvm_lts
  when: blast_nvm_init.stat.exists
- name: Install Node.js LTS with NVM
  become: true
  become_user: "{{ blast_username }}"
  ansible.builtin.shell:
    cmd: |
      source /usr/share/nvm/init-nvm.sh
      nvm install --lts
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ blast_user_home }}/.local/share/nvm"
    HOME: "{{ blast_user_home }}"
  when:
    - blast_nvm_init.stat.exists
    - (blast_nvm_lts.rc | default(1)) == 3
- name: Check target user's NVM default alias
  become: true
  become_user: "{{ blast_username }}"
  ansible.builtin.command:
    cmd: cat "{{ blast_user_home }}/.local/share/nvm/alias/default"
  changed_when: false
  failed_when: false
  register: blast_nvm_default
  when: blast_nvm_init.stat.exists
- name: Set Node.js LTS as NVM default
  become: true
  become_user: "{{ blast_username }}"
  ansible.builtin.shell:
    cmd: |
      source /usr/share/nvm/init-nvm.sh
      nvm alias default 'lts/*'
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ blast_user_home }}/.local/share/nvm"
    HOME: "{{ blast_user_home }}"
  when:
    - blast_nvm_init.stat.exists
    - >-
      (blast_nvm_default.rc | default(1)) != 0 or
      (blast_nvm_default.stdout | default('') | trim) != 'lts/*'
- name: Check target user's pnpm installation
  become: true
  become_user: "{{ blast_username }}"
  ansible.builtin.shell:
    cmd: |
      source /usr/share/nvm/init-nvm.sh
      nvm exec --silent 'lts/*' pnpm --version
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ blast_user_home }}/.local/share/nvm"
    HOME: "{{ blast_user_home }}"
  changed_when: false
  failed_when: false
  register: blast_pnpm
  when: blast_nvm_init.stat.exists
- name: Install pnpm in the NVM Node.js environment
  become: true
  become_user: "{{ blast_username }}"
  ansible.builtin.shell:
    cmd: |
      source /usr/share/nvm/init-nvm.sh
      nvm exec --silent 'lts/*' npm install --global pnpm
    executable: /bin/bash
  environment:
    NVM_DIR: "{{ blast_user_home }}/.local/share/nvm"
    HOME: "{{ blast_user_home }}"
  when:
    - blast_nvm_init.stat.exists
    - (blast_pnpm.rc | default(1)) != 0
