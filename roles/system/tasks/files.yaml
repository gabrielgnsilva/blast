- name: Check zram package for managed zram files
  ansible.builtin.command:
    cmd: pacman -Qq zram-generator
  changed_when: false
- name: Check reflector packages for managed reflector cron file
  ansible.builtin.command:
    cmd: "pacman -Qq {{ package_name }}"
  changed_when: false
  loop:
    - cronie
    - reflector
  loop_control:
    loop_var: package_name
- name: Install base system files
  ansible.builtin.copy:
    src: system/
    dest: /
    owner: root
    group: root
    mode: preserve
    directory_mode: preserve
  register: blast_system_files_copy
