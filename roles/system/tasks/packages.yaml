- name: Load base system package groups
  ansible.builtin.include_vars:
    file: packages.yaml
- name: Install base system package groups
  community.general.pacman:
    name: "{{ package_group.packages }}"
    state: present
  loop: "{{ blast_system_package_groups }}"
  loop_control:
    loop_var: package_group
    label: "{{ package_group.name }}"
